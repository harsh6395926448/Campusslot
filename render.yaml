# CampusSlot Render Blueprint. Commit this file to the GitHub repository.
# Render creates a web service and a managed PostgreSQL database.
services:
  - type: web
    name: campusslot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/advanced/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusslot-db
          property: connectionString
      # Render provides RENDER_EXTERNAL_URL automatically. config.py uses it
      # as BASE_URL unless BASE_URL is explicitly set in the dashboard.
      - key: APPOINTMENT_TIMEZONE
        value: Asia/Kolkata
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"

databases:
  - name: campusslot-db
    databaseName: campusslot
    user: campusslot_user
    plan: free
